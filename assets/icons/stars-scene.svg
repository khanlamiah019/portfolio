<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" shape-rendering="crispEdges">
<style>
  .star { animation-name: twinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: alternate; opacity: var(--base-op); }
  @keyframes twinkle {
    from { opacity: var(--base-op); }
    to   { opacity: 0.08; }
  }
  .moon { animation: moon-float 2.6s ease-in-out infinite alternate; }
  @keyframes moon-float {
    from { translate: 0 0; }
    to   { translate: -6px 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .star, .moon { animation: none; }
  }
</style>
