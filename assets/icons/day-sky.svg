<style>
  .cloud { animation-name: cloud-drift; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: alternate; }
  @keyframes cloud-drift {
    from { translate: 0 0; }
    to   { translate: var(--amp) 0; }
  }
  .sun { animation: sun-float 5s ease-in-out infinite alternate; }
  @keyframes sun-float {
    from { translate: 0 0; }
    to   { translate: 0 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud, .sun { animation: none; }
  }
</style>
